<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dragons" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Wizard and Dragons</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1e2a4a; overscroll-behavior: none; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: -apple-system, system-ui, sans-serif; }
      button { -webkit-tap-highlight-color: transparent; cursor: pointer; font-family: inherit; }
      #game { position: fixed; inset: 0; width: 100vw; height: 100dvh; outline: none; touch-action: none; }
      .hidden { display: none !important; }
      #hud { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); right: calc(16px + env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: center; font-size: 30px; pointer-events: none; }
      #hudRight { display: flex; align-items: center; gap: 18px; }
      #friends span { opacity: 0.25; filter: grayscale(1); transition: all 0.4s; font-size: 26px; }
      #friends span.got { opacity: 1; filter: none; }
      #stars { color: #fff; font-weight: 600; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4); }
      #mute { pointer-events: auto; width: 54px; height: 54px; border-radius: 50%; border: 3px solid #fff; background: rgba(0, 0, 0, 0.3); font-size: 26px; }
      #grump { position: fixed; top: calc(76px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; font-size: 32px; pointer-events: none; }
      #grumpBar { width: 280px; height: 22px; border-radius: 11px; background: rgba(0, 0, 0, 0.35); border: 3px solid #fff; overflow: hidden; }
      #grumpFill { height: 100%; width: 100%; background: #e24b4a; transition: width 0.3s; }
      #spells { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 22px; }
      #spells button { width: 104px; height: 104px; border-radius: 50%; border: 5px solid #fff; font-size: 50px; line-height: 1; transition: transform 0.1s, opacity 0.2s; }
      #spells button:active, #ride:active { transform: scale(0.9); }
      #spells.cooling button { opacity: 0.55; }
      [data-spell="fire"] { background: #d85a30; }
      [data-spell="ice"] { background: #378add; }
      [data-spell="lightning"] { background: #ef9f27; }
      [data-spell="shield"] { background: #7f77dd; }
      #run { position: fixed; bottom: calc(32px + env(safe-area-inset-bottom)); left: calc(24px + env(safe-area-inset-left)); width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: rgba(0, 0, 0, 0.35); font-size: 38px; color: #fff; }
      #ride { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); right: calc(24px + env(safe-area-inset-right)); width: 112px; height: 112px; border-radius: 50%; border: 5px solid #fff; background: #1d9e75; font-size: 46px; line-height: 1; transition: transform 0.1s; }
      #ride small { display: block; font-size: 30px; }
      #banner { position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%); font-size: 96px; pointer-events: none; animation: pop 0.4s ease-out; white-space: nowrap; }
      @keyframes pop { from { transform: translate(-50%, -50%) scale(0.3); } to { transform: translate(-50%, -50%) scale(1); } }
      #fade { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
      #fade.on { opacity: 1; }
      #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; background: rgba(30, 42, 74, 0.82); color: #fff; }
      #start h1 { margin: 0; font-size: 54px; font-weight: 600; }
      #startButtons { display: flex; align-items: center; gap: 36px; }
      #play { width: 160px; height: 160px; border-radius: 50%; border: 6px solid #fff; background: #ef9f27; font-size: 72px; color: #fff; }
      #dress { width: 110px; height: 110px; border-radius: 50%; border: 5px solid #fff; background: #534ab7; font-size: 54px; }
      #wardrobe { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 24px; border-radius: 28px; background: rgba(30, 42, 74, 0.85); }
      .row { display: flex; gap: 14px; }
      .swatch { width: 64px; height: 64px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, 0.35); }
      .swatch.on { border-color: #fff; transform: scale(1.12); }
      .hatPick { width: 80px; height: 64px; border-radius: 18px; border: 4px solid rgba(255, 255, 255, 0.35); background: rgba(255, 255, 255, 0.12); padding: 6px; }
      .hatPick.on { border-color: #fff; }
      .hatPick svg { width: 100%; height: 100%; }
      #dressDone { width: 84px; height: 84px; border-radius: 50%; border: 5px solid #fff; background: #1d9e75; font-size: 40px; color: #fff; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="hearts"></div>
      <div id="hudRight"><div id="friends"></div><div id="stars"></div><button id="mute" aria-label="Sound">🔊</button></div>
    </div>
    <div id="grump" class="hidden"><span>😠</span><div id="grumpBar"><div id="grumpFill"></div></div><span>😊</span></div>
    <div id="spells" class="hidden">
      <button data-spell="fire" aria-label="Fire">🔥</button>
      <button data-spell="ice" aria-label="Ice">❄️</button>
      <button data-spell="lightning" aria-label="Lightning">⚡</button>
      <button data-spell="shield" aria-label="Shield">🛡️</button>
    </div>
    <button id="run" class="hidden" aria-label="Walk away">↩</button>
    <button id="ride" class="hidden" aria-label="Ride"><span>🐉</span><small>⬆</small></button>
    <div id="banner" class="hidden"></div>
    <div id="wardrobe" class="hidden">
      <div class="row" id="robes"></div>
      <div class="row" id="crystals"></div>
      <div class="row">
        <button class="hatPick" data-hat="hood" aria-label="Hood"><svg viewBox="0 0 40 30"><path d="M20 2 L33 28 L7 28 Z" fill="#fff" /></svg></button>
        <button class="hatPick" data-hat="hat" aria-label="Pointed hat"><svg viewBox="0 0 40 30"><path d="M22 0 L28 24 L14 24 Z" fill="#fff" /><rect x="3" y="24" width="34" height="4" rx="2" fill="#fff" /></svg></button>
        <button id="dressDone" aria-label="Done">✓</button>
      </div>
    </div>
    <div id="fade"></div>
    <div id="start"><h1>Wizard and Dragons</h1><div id="startButtons"><button id="dress" aria-label="Change wizard">🧙</button><button id="play" aria-label="Play">▶</button></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
